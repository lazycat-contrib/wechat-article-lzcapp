version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/wechat-article.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: wechat-article

build:
  run_buildscript: false

images:
  - id: wechat-article
    target: service
    service: wechat-article
    source: ghcr.io/wechat-article/wechat-article-exporter
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: 公众号文章下载
    summary: "一款开源且免费的公众号文章下载神器"
